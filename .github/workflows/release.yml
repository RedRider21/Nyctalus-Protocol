#
# Compila l'eseguibile `nyctalus` per i principali sistemi operativi.
# - Su un tag `v*`  -> pubblica i binari come Release di GitHub.
# - Su avvio manuale -> carica solo gli artefatti (per verificare la build).

name: Eseguibili

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: aarch64-linux-gnu
          # il motore per il telefono (Termux): col kit Android già presente sui server di GitHub,
          # così l'app lo porta pronto e in Termux non si compila (prima 10-30 minuti)
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Toolchain di cross per aarch64 Linux
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=${{ matrix.cross }}-ar" >> "$GITHUB_ENV"

      - name: Kit Android (NDK) per il telefono
        if: matrix.android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Compila
        run: cargo build --release --locked --target ${{ matrix.target }} -p nyctalus

      - name: Prepara il binario
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/nyctalus${ext}" "dist/nyctalus-${{ matrix.target }}${ext}"

      - name: Carica artefatto (verifica)
        uses: actions/upload-artifact@v4
        with:
          name: nyctalus-${{ matrix.target }}
          path: dist/*

      - name: Pubblica nella Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # le note le scrive chi crea la release (qui si aggiungono solo i binari)
          prerelease: true
          files: dist/*
