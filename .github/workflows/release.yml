#
# Compila l'eseguibile `nyctalus` per i principali sistemi operativi.
# Solo su avvio manuale: carica gli artefatti, che chi pubblica scarica, impacchetta e FIRMA
# (strumenti/firma-release.sh) prima di creare la release. Dalla 0.3.20 un tag `v*` NON avvia
# più nulla: ricompilare e caricare i binari su una release già firmata cambierebbe le impronte
# e renderebbe falso il SHA256SUMS.

name: Eseguibili

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux su Ubuntu 22.04 (glibc 2.35): così i binari partono anche su Debian 12,
          # Raspberry Pi OS e Ubuntu 22.04 (compilati su 24.04 chiederebbero glibc 2.39)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: aarch64-linux-gnu
          # il motore per il telefono (Termux): col kit Android già presente sui server di GitHub,
          # così l'app lo porta pronto e in Termux non si compila (prima 10-30 minuti)
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: aarch64-linux-android24
          # anche tablet e telefoni a 32 bit (molti tablet hanno Android a 32 bit) e Intel/AMD
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            android: armv7a-linux-androideabi24
          - os: ubuntu-latest
            target: x86_64-linux-android
            android: x86_64-linux-android24
          - os: ubuntu-latest
            target: i686-linux-android
            android: i686-linux-android24
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Toolchain di cross per aarch64 Linux
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=${{ matrix.cross }}-ar" >> "$GITHUB_ENV"

      - name: Kit Android (NDK) per il telefono
        if: matrix.android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          T="${{ matrix.target }}"
          T_MAIUSC="$(echo "$T" | tr 'a-z-' 'A-Z_')"
          T_MINUSC="$(echo "$T" | tr '-' '_')"
          echo "CARGO_TARGET_${T_MAIUSC}_LINKER=$BIN/${{ matrix.android }}-clang" >> "$GITHUB_ENV"
          echo "CC_${T_MINUSC}=$BIN/${{ matrix.android }}-clang" >> "$GITHUB_ENV"
          echo "AR_${T_MINUSC}=$BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Compila
        run: cargo build --release --locked --target ${{ matrix.target }} -p nyctalus

      - name: Prepara il binario
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/nyctalus${ext}" "dist/nyctalus-${{ matrix.target }}${ext}"

      - name: Carica artefatto (verifica)
        uses: actions/upload-artifact@v4
        with:
          name: nyctalus-${{ matrix.target }}
          path: dist/*

      - name: Pubblica nella Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # le note le scrive chi crea la release (qui si aggiungono solo i binari).
          # Pre-release SOLO per i tag con un trattino (es. v0.1.0-anteprima): una versione
          # normale (v0.3.1) resta release vera e «Latest». Prima era sempre «true» e
          # rimetteva come pre-release le release appena pubblicate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
