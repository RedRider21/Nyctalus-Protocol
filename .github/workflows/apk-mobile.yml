name: apk-mobile

# Compila l'app Android (mobile/android) con lo stesso script usato in locale
# (strumenti/compila-apk.sh: aapt2 → javac → d8 → apksigner, senza Gradle) e la
# pubblica come artifact; con una Release la allega alla Release.
# Nota: qui la chiave di firma è nuova a ogni esecuzione (chiave di sviluppo),
# quindi prima di installare questa APK va tolta una versione firmata altrove.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/android/**'
      - 'strumenti/compila-apk.sh'
      - '.github/workflows/apk-mobile.yml'
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # L'Android SDK è già installato sulle macchine di GitHub ($ANDROID_HOME): niente
      # android-actions/setup-android (la v3 si blocca cercando il pacchetto «tools», ritirato).
      - name: Pacchetti SDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Compila
        run: bash strumenti/compila-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nyctalus-apk
          path: mobile/android/Nyctalus.apk
      - name: Allega alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: mobile/android/Nyctalus.apk
