[package]
name = "nyctalus-core"
description = "Nucleo di Nyctalus Protocol: etichette segrete, frammenti, ricomposizione"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
snow = { version = "0.10.0", default-features = false, features = ["std", "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
